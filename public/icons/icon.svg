<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source of the home-screen icons (T-014; the builder chose the character 票 on 2026-11-17):
       icon-192.png, icon-512.png, apple-touch-icon.png are this file rendered at 192, 512, and
       180 px in Chromium on the Mac, where PingFang SC draws the character. Elsewhere the font may
       differ, so the PNGs, not this file, are what phones see. The character stays inside the
       central circle of 80% diameter, so Android may crop the square to any shape ("maskable").
       Colours: the primary orange of the page design (src/app/globals.css). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8f45"/>
      <stop offset="0.55" stop-color="#e8590c"/>
      <stop offset="1" stop-color="#c94a08"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="PingFang SC" font-weight="600" font-size="270" fill="#fffdf9">票</text>
</svg>
