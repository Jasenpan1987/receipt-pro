AWSTemplateFormatVersion: "2010-09-09"
# Uploaded once by the builder in the CloudFormation console, with an administrator, as stack
# `receipt-pro-bootstrap` (docs/runbooks/deploy.md). It lets GitHub Actions deploy the app stack
# (deploy/app.yaml) with no AWS key stored anywhere: GitHub OIDC tokens for this repository's
# environment `production` can assume the deploy role, and nothing else can (ADR-007).
Description: receipt-pro deployment access for GitHub Actions (OIDC, deploy role, permissions boundary)

Parameters:
  # GitHub puts owner and repository IDs in the OIDC subject of repositories created after
  # 2026-07-15 ("immutable subject"), so a deleted and re-created name cannot deploy. The value is
  # `sub_claim_prefix` of `gh api repos/Jasenpan1987/receipt-pro/actions/oidc/customization/sub`,
  # without `repo:`. The first deploy failed with the plain owner/name form (2026-11-15).
  GitHubRepository:
    Type: String
    Default: Jasenpan1987@13688927/receipt-pro@1458384092
    Description: owner@owner-id/name@repo-id of the repository whose workflows may deploy
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub environment of the deploy job; only `main` may deploy to it
  TableName:
    Type: String
    Default: receipt-pro
  BucketName:
    Type: String
    Default: receipt-pro-photos-jasen
  # The app's own address (T-014). Must equal APP_DOMAIN and HOSTED_ZONE_ID in
  # .github/workflows/deploy.yml: the deploy role may only change DNS records with this name, or
  # names under it (the certificate's validation record).
  AppDomainName:
    Type: String
    Default: receipts.jasenpan.com
    Description: The app's address; lowercase, no trailing dot
  HostedZoneId:
    Type: String
    Default: Z3K1R8HA8U98WG
    Description: Route 53 hosted zone that holds AppDomainName

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # The most the app's role can ever do, whatever the app stack writes into it: the data the app
  # already uses (ADR-005) and its own logs. The deploy role can only create that role with this
  # boundary attached.
  AppPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: receipt-pro-app-boundary
      Description: Upper limit of the receipt-pro Lambda role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Table
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:ConditionCheckItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
          - Sid: PhotoObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}/*
          - Sid: PhotoList
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/receipt-pro:*

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: receipt-pro-deploy
      Description: Assumed by GitHub Actions to deploy the receipt-pro app stack
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: receipt-pro-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AppStack
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/receipt-pro-app/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*
              - Sid: TemplateChecks
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:receipt-pro
              # The AWS Lambda Web Adapter, published by AWS (deploy/app.yaml).
              - Sid: AdapterLayer
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:*
              - Sid: AppRoleWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/receipt-pro-app
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref AppPermissionsBoundary
              - Sid: AppRoleManage
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:DeleteRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/receipt-pro-app
              - Sid: AppRolePass
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/receipt-pro-app
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: KeepBoundary
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/receipt-pro-app
              - Sid: LogGroup
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/receipt-pro
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/receipt-pro:*
              - Sid: LogGroupList
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              # T-014. The actions below are those the CloudFormation handlers of
              # AWS::CertificateManager::Certificate, AWS::CloudFront::Distribution, and
              # AWS::Route53::RecordSet list in their schemas, without the private-CA and
              # multi-tenant ones this app does not use. CreateDistributionWithTags is not an IAM
              # action: CreateDistribution and TagResource authorize it.
              - Sid: CertStack
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/receipt-pro-cert/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/*/*
              - Sid: CertificateRequest
                Effect: Allow
                Action: acm:RequestCertificate
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                    acm:ValidationMethod: DNS
                  ForAllValues:StringEquals:
                    acm:DomainNames:
                      - !Ref AppDomainName
              - Sid: Certificate
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:UpdateCertificateOptions
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                  - acm:ListTagsForCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/*
              - Sid: CertificateList
                Effect: Allow
                Action: acm:ListCertificates
                Resource: "*"
              - Sid: Distribution
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateDistributionWithStagingConfig
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - Sid: DistributionRead
                Effect: Allow
                Action:
                  - cloudfront:ListDistributions
                  - cloudfront:GetConnectionGroup
                  - cloudfront:GetVpcOrigin
                Resource: "*"
              # Only the app's records: asr, tts, and every other name in the zone stay out of reach.
              - Sid: AppRecords
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - !Ref AppDomainName
                      - !Sub "*.${AppDomainName}"
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsRecordTypes:
                      - A
                      - AAAA
                      - CNAME
              - Sid: Zone
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
              - Sid: ZoneChange
                Effect: Allow
                Action: route53:GetChange
                Resource: !Sub arn:${AWS::Partition}:route53:::change/*
              - Sid: ZoneList
                Effect: Allow
                Action: route53:ListHostedZones
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Add as secret AWS_DEPLOY_ROLE_ARN in GitHub environment production
    Value: !GetAtt DeployRole.Arn
  AppPermissionsBoundaryArn:
    Description: deploy/app.yaml attaches it to the app role by this name
    Value: !Ref AppPermissionsBoundary
