# Every push to main is a release (ADR-007): checks and build first, then the deploy job, which
# alone can reach AWS. Logs of this public repository are public: nothing here prints secrets,
# the account ID (masked), or the app's address (masked).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Check and build
    # Linux arm64, like the function: the standalone build carries native packages.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec oxfmt --check
      - name: Type check
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Package
        run: pnpm package:lambda
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda
          path: dist/lambda.zip
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    # Only main may deploy to this environment, and only it holds the secrets and the role.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: receipt-pro-deploy-${{ github.run_id }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true

      # A first deploy that failed leaves the stack in ROLLBACK_COMPLETE, which cannot be
      # updated, only deleted. It holds nothing: the data lives outside this stack (ADR-005).
      - name: Clear a failed first deploy
        run: |
          status=$(aws cloudformation describe-stacks --stack-name receipt-pro-app \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          echo "Stack status: $status"
          if [ "$status" = ROLLBACK_COMPLETE ]; then
            aws cloudformation delete-stack --stack-name receipt-pro-app
            aws cloudformation wait stack-delete-complete --stack-name receipt-pro-app
          fi

      - name: Stack
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          aws cloudformation deploy \
            --stack-name receipt-pro-app \
            --template-file deploy/app.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "DeepSeekApiKey=$DEEPSEEK_API_KEY" "SessionSecret=$SESSION_SECRET" \
            > /dev/null
          echo "Stack up to date."

      - name: Stack events after a failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events --stack-name receipt-pro-app --max-items 15 \
            --query "StackEvents[].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output text || true

      - name: Code
        run: |
          aws lambda update-function-code --function-name receipt-pro \
            --zip-file fileb://dist/lambda.zip > /dev/null
          aws lambda wait function-updated-v2 --function-name receipt-pro
          echo "Code updated."

      - name: Check the deployed app
        run: |
          url=$(aws cloudformation describe-stacks --stack-name receipt-pro-app \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          echo "::add-mask::$url"
          status=000
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${url}login" || true)
            [ "$status" = 200 ] && break
            sleep 5
          done
          echo "GET /login: $status"
          [ "$status" = 200 ]
